<div class="flex flex-col lg:flex-row h-screen-minus-navbar gap-4">
  <!-- Activities Panel -->
  <div class="w-full lg:w-96 flex flex-col bg-white dark:bg-gray-900 rounded-lg border border-gray-200 dark:border-gray-700 overflow-hidden shadow-sm">
    <!-- Collapsible Days Navigator -->
    <ts-collapsible-section
      [title]="'Days'"
      [subtitle]="getSelectedDayLabel()"
      [isExpandedInitial]="!isMobileViewport()"
      [showIcon]="true"
      [showToggleIcon]="true"
      [alwaysShowSubtitle]="false"
      [storageKey]="'journey-calendar-collapsed'"
      (expandedChange)="onCalendarExpandedChange($event)"
    >
      <div class="space-y-4">
        <ts-days-navigator
          #daysNavigator
          [journey]="journey() || null"
          [selectedDay]="selectedDay()"
          [viewMode]="dayNavigatorMode()"
          [activities]="allActivities()"
          [activitySummary]="activitySummary()"
          [firstDayOfWeek]="firstDayOfWeek()"
          (dayChange)="onDayChange($event)"
          (viewModeChange)="onDayNavigatorModeChange($event)"
          (pageChange)="onPageChange($event)"
          (monthChange)="onMonthChange($event)"
        />
      </div>
    </ts-collapsible-section>

    <!-- Sticky Header with Activities Controls -->
    <div class="sticky top-0 z-10 bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-700 px-4 py-3 shadow-sm">
      <div class="flex items-center justify-between gap-3">
        <ts-activities-view-toggle
          [viewMode]="activitiesViewMode()"
          (viewModeChange)="onActivitiesViewModeChange($event)"
        />
        <div class="flex gap-2">
          <ts-button
            type="button"
            variant="primary"
            size="sm"
            [label]="'Add Activity'"
            icon="plus"
            (buttonAction)="openAddActivityModal()"
          />
          <ts-button
            type="button"
            variant="secondary"
            size="sm"
            [label]="'From Bucket List'"
            icon="bucket"
            (buttonAction)="openBucketListPicker()"
          />
        </div>
      </div>
    </div>

    <!-- Activities List with Scroll Indicators -->
    <div class="flex-1 min-h-0 relative overflow-hidden">
      <!-- Top scroll shadow -->
      <div 
        class="absolute top-0 left-0 right-0 h-6 bg-gradient-to-b from-white dark:from-gray-900 to-transparent pointer-events-none z-10 transition-opacity duration-200"
        [class.opacity-0]="!hasScrolledTop()"
      ></div>
      
      <!-- Activities list container -->
      <div 
        #activitiesScrollContainer
        class="h-full overflow-y-auto px-4 py-4"
        (scroll)="onActivitiesScroll($event)"
      >
        <ts-day-activities-list
          [activities]="currentDayActivities()"
          [viewMode]="activitiesViewMode()"
          [isLoading]="isLoadingActivities()"
          (editActivity)="onEditActivity($event)"
          (deleteActivity)="onDeleteActivity($event)"
          (reorderActivities)="onReorderActivities($event)"
          (addActivityBetween)="onAddActivityBetween($event)"
        />
      </div>
      
      <!-- Bottom scroll shadow -->
      <div 
        class="absolute bottom-0 left-0 right-0 h-6 bg-gradient-to-t from-white dark:from-gray-900 to-transparent pointer-events-none z-10 transition-opacity duration-200"
        [class.opacity-0]="!hasScrolledBottom()"
      ></div>
    </div>
  </div>

  <!-- Map Panel - Responsive: below activities on small screens, beside on large screens -->
  <div class="order-last lg:order-none flex-1 bg-gray-100 dark:bg-gray-800 rounded-lg flex items-center justify-center min-h-64 lg:min-h-0">
    <div class="text-center text-gray-500 dark:text-gray-400">
      <fa-icon class="h-16 w-16 mx-auto mb-4" [icon]="['fas', 'map']" />
      <h3 class="text-lg font-semibold mb-2" i18n="@@journeyActivities.map.title">Map</h3>
      <p class="text-sm" i18n="@@journeyActivities.map.description">Map will be implemented in the future</p>
    </div>
  </div>
</div>
