@if (isLoading()) {
  <div class="flex justify-center items-center py-12">
    <ts-loading-indicator class="h-8 w-8 text-sky-600 dark:text-sky-400" />
  </div>
} @else if (error()) {
  <ts-alert type="error" title="Error" [message]="error()" />
} @else if (tag()) {
  <ts-tag-header
    [tag]="tag()!"
    (editTag)="onEditTag()"
  />

  <ts-sticky-list-tools [showBorder]="false">
    <ts-tab-links [tabs]="tagTabs()" ariaLabel="Tag navigation" />
  </ts-sticky-list-tools>

  <div class="mt-6">
    <router-outlet />
  </div>
} @else {
  <div class="flex justify-center items-center py-12">
    <div class="text-center">
      <p class="text-gray-500 dark:text-gray-400">Tag not found</p>
      <a
        class="mt-4 inline-block text-sky-600 dark:text-sky-400 hover:underline"
        routerLink="/tags"
      >
        Return to tags list
      </a>
    </div>
  </div>
}
