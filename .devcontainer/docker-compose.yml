version: '3.8'

services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
      - /var/run/docker.sock:/var/run/docker.sock
    command: sleep infinity
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_NOLOGO=true
      - DOTNET_CLI_TELEMETRY_OPTOUT=true
    networks:
      - travelsidecar-dev
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  postgres:
    image: imresamu/postgis:17-3.5
    restart: unless-stopped
    ports:
      - "55000:5432"
    environment:
      POSTGRES_DB: travelsidecar
      POSTGRES_USER: travelsidecaru
      POSTGRES_PASSWORD: travelsidecarpw
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - travelsidecar-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelsidecaru -d travelsidecar"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - travelsidecar-dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - travelsidecar-dev
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minio minio123;
      /usr/bin/mc mb --ignore-existing myminio/travelsidecar-dev;
      /usr/bin/mc anonymous set public myminio/travelsidecar-dev;
      exit 0;
      "

volumes:
  postgres-data:
  minio-data:

networks:
  travelsidecar-dev:
    driver: bridge